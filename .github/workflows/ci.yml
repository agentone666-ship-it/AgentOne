name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Validate shared test entrypoint
        run: bash -n scripts/ci.sh

  runtime:
    name: Runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: AgentOneLifeRuntime/package-lock.json
      - run: npm ci --prefix AgentOneLifeRuntime
      - name: Test clean build, JSONL processes and Memory MCP
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          bash scripts/ci.sh runtime 2>&1 | tee build/ci-logs/runtime.log
      - name: Audit production dependencies
        if: matrix.node == '24'
        run: npm audit --prefix AgentOneLifeRuntime --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-logs-node-${{ matrix.node }}
          path: |
            build/ci-logs/
            build/benchmarks/
          retention-days: 7

  macos:
    name: macOS tests and package
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: AgentOneLifeRuntime/package-lock.json
      - name: Verify toolchain
        run: |
          swift --version
          node --version
          zsh -n scripts/build_app.sh scripts/test_e2e.sh
      - run: npm ci --prefix AgentOneLifeRuntime
      - name: Swift unit tests and synthetic OCR
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          bash scripts/ci.sh swift 2>&1 | tee build/ci-logs/swift.log
      - name: Native audio and regression harnesses
        run: |
          set -o pipefail
          bash scripts/ci.sh integration 2>&1 | tee build/ci-logs/integration.log
      - name: Build and verify the actual Release ZIP
        run: |
          set -o pipefail
          bash scripts/ci.sh package 2>&1 | tee build/ci-logs/package.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentOne-macos-arm64
          path: |
            build/AgentOne.app.zip
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-test-logs
          path: build/ci-logs/
          retention-days: 7

  all-checks-passed:
    name: all checks passed
    needs: [workflow-lint, runtime, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Gate results: $RESULTS"
          if [[ "$RESULTS" != 'success,success,success' ]]; then
            echo '::error::A required gate failed or was skipped'
            exit 1
          fi
