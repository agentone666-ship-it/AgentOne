name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: AgentOneLifeRuntime/package-lock.json

      - name: Install Sidecar dependencies
        working-directory: AgentOneLifeRuntime
        run: npm ci

      - name: Test Sidecar
        working-directory: AgentOneLifeRuntime
        run: npm test

      - name: Build Swift targets
        run: swift build

      - name: Test Swift Core
        run: swift test
