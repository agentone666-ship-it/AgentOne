name: 场景与功能建议 / Suggest a scenario
description: 描述想找回的现场、下一步需求和预期结果。请使用脱敏信息。
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 在什么场景下遇到什么问题？请使用脱敏信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与验收标准
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 涉及的数据和权限
